[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "growatt-rtu-broker"
version = "0.1.0"
description = "Growatt Pi in the Middle bridge, forensic capture, and simulator toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "PiITM contributors" }
]
dependencies = [
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "black==24.1.1",
  "pytest>=8.0,<9",
  "pre-commit",
  "ruff==0.2.0",
  "pymodbus>=3.8,<4",
]
test = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<0.27",
  "pymodbus>=3.8,<4",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[project.urls]
Homepage = "https://github.com/l4m4re/growatt-rtu-broker"
Issues = "https://github.com/l4m4re/growatt-rtu-broker/issues"

[project.scripts]
growatt-broker = "growatt_broker.broker:main"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "enable_socket: test opens loopback sockets",
]

[tool.setuptools.packages.find]
include = ["growatt_broker*"]

[tool.setuptools.package-data]
"growatt_broker.simulator" = ["*.json", "datasets/*.json"]
