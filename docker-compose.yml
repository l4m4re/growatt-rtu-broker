version: "3.8"
services:
  broker:
    # This compose example is the combined Shine profile. For no-Shine
    # legacy/cache operation use docker/run_broker.sh or the CLI directly.
    build: .
    container_name: growatt-rtu-broker
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      # Keep udev aliases and newly-created ttyUSB nodes visible after replug.
      - "/dev:/dev"
    command: >-
      growatt-broker
      --inverter ${INV_DEV}
      --shine ${SHINE_DEV}
      --mode ${BROKER_MODE:-legacy}
      --baud ${BAUD:-115200}
      --bytes ${BYTES:-8N1}
      --tcp ${TCP_BIND:-0.0.0.0:5020}
      --tcp-alt ${TCP_ALT_BIND:-0.0.0.0:5021}
      --sniff ${SNIFF_BIND:-0.0.0.0:5700}
      --min-period ${MIN_PERIOD:-1.0}
      --rtimeout ${RTIMEOUT:-1.5}
      --prod-tcp-writes ${PROD_TCP_WRITES:-enabled}
      --dev-tcp-writes ${DEV_TCP_WRITES:-enabled}
      --log ${LOG_PATH:--}
